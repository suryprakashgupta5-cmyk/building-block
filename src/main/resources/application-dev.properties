# ── Datasource: Master ───────────────────────────────────────────
spring.datasource.master.jdbc-url=jdbc:mysql://localhost:3306/building_block?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.master.username=${DB_USERNAME:root}
spring.datasource.master.password=${DB_PASSWORD:}
spring.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.master.pool-name=MedFlow-Master-Pool
spring.datasource.master.maximum-pool-size=5
spring.datasource.master.minimum-idle=1
spring.datasource.master.connection-timeout=20000
spring.datasource.master.idle-timeout=300000
spring.datasource.master.max-lifetime=1200000

# ── Datasource: Tenant ───────────────────────────────────────────
spring.datasource.tenant.url-template=jdbc:mysql://localhost:3306/building_block%d?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.tenant.username=${DB_USERNAME:root}
spring.datasource.tenant.password=${DB_PASSWORD:}

# ── Mail (Dev — MailHog / local SMTP) ────────────────────────────
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── JPA (Dev — show SQL) ─────────────────────────────────────────
spring.jpa.show-sql=true

# ── Logging ──────────────────────────────────────────────────────
logging.level.in.medflowpro=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ── JWT ──────────────────────────────────────────────────────────
app.jwt.secret=dev-secret-key-medflow-pro-minimum-32-characters-long

# ── CORS ─────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization



# ── Actuator Info ────────────────────────────────────────────────
info.app.environment=development