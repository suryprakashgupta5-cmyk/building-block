spring.application.name=building-block
# ── Profiles ────────────────────────────────────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.profiles.group.production=prod
spring.profiles.group.local=dev

# ── Main ────────────────────────────────────────────────────────
spring.main.banner-mode=log
spring.main.log-startup-info=true

# ── JPA / Hibernate ─────────────────────────────────────────────
# ddl-auto: none — schema managed by PlatformBootstrapInitializer
# Hibernate never creates or alters tables.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# ── Cache (Caffeine) ─────────────────────────────────────────────
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

# ── Multipart (file uploads) ─────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Jackson ──────────────────────────────────────────────────────
#spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# ── Server ───────────────────────────────────────────────────────
server.port=8082

# ── JWT ──────────────────────────────────────────────────────────
# JWT secret, CORS origins, and seed toggles are profile-specific
# and live in application-dev.properties / application-prod.properties
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-days=7

# ── Pagination ───────────────────────────────────────────────────
app.pagination.default-page-size=20
app.pagination.max-page-size=100

# ── Uploads ──────────────────────────────────────────────────────
app.uploads.dir=${APP_UPLOADS_DIR:./uploads}
app.uploads.max-logo-size-bytes=2097152

# ── Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── OpenAPI / Swagger ────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.info.title=MediOmen API
springdoc.info.version=1.0.0
springdoc.info.description=REST API for MediOmen Clinic Management Suite

# ── Actuator Info ────────────────────────────────────────────────
info.app.name=MediOmen API
info.app.description=Backend API for MediOmen Clinic Management Suite

