name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4        # ← updated to v4

      - name: Set up Java 21
        uses: actions/setup-java@v4      # ← updated to v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven                   # ← caches dependencies, faster builds

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Run Tests
        run: ./mvnw test

      - name: Log in to Docker Hub      # ← moved BEFORE docker build
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image  # ← build + push in one step
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}  # only push on main branch
          tags: ${{ secrets.DOCKER_USERNAME }}/building-block:latest